<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Platform Replica</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <h1>Agent Platform</h1>
        <nav>
          <button class="nav-item active" data-screen="dashboard">Dashboard</button>
          <button class="nav-item" data-screen="builder">Agent Builder</button>
          <button class="nav-item" data-screen="knowledge">Knowledge Base</button>
          <button class="nav-item" data-screen="channels">Channels</button>
          <button class="nav-item" data-screen="analytics">Analytics</button>
        </nav>
      </aside>

      <main class="content">
        <header class="topbar">
          <h2 id="screen-title">Dashboard</h2>
          <div class="actions">
            <button id="simulate-btn">Simulate Conversation</button>
            <button id="deploy-btn">Deploy Agent</button>
          </div>
        </header>

        <section id="dashboard" class="screen active">
          <div class="grid cards">
            <article class="card"><h3>Agents</h3><p id="agents-count">4</p></article>
            <article class="card"><h3>Conversations Today</h3><p id="conversations-count">1,284</p></article>
            <article class="card"><h3>Automation Rate</h3><p id="automation-rate">73%</p></article>
            <article class="card"><h3>CSAT</h3><p id="csat">4.6 / 5</p></article>
          </div>
          <article class="panel">
            <h3>Recent Activity</h3>
            <ul id="activity-list"></ul>
          </article>
        </section>

        <section id="builder" class="screen">
          <div class="builder-layout">
            <article class="panel">
              <h3>Flow Nodes</h3>
              <div id="node-palette" class="node-palette"></div>
            </article>
            <article class="panel">
              <h3>Flow Canvas</h3>
              <div id="flow-canvas" class="flow-canvas"></div>
            </article>
            <article class="panel">
              <h3>Node Properties</h3>
              <form id="node-form">
                <label>Label <input id="node-label" /></label>
                <label>Message <textarea id="node-message"></textarea></label>
                <button type="submit">Save Node</button>
              </form>
            </article>
          </div>
        </section>

        <section id="knowledge" class="screen">
          <article class="panel">
            <h3>Knowledge Articles</h3>
            <form id="kb-form" class="inline-form">
              <input id="kb-title" placeholder="Article title" required />
              <button type="submit">Add</button>
            </form>
            <ul id="kb-list"></ul>
          </article>
        </section>

        <section id="channels" class="screen">
          <article class="panel">
            <h3>Connected Channels</h3>
            <div class="channel-list" id="channel-list"></div>
          </article>
        </section>

        <section id="analytics" class="screen">
          <article class="panel">
            <h3>Intent Performance</h3>
            <table>
              <thead><tr><th>Intent</th><th>Volume</th><th>Resolution</th></tr></thead>
              <tbody id="intent-table"></tbody>
            </table>
          </article>
        </section>
      </main>
    </div>

    <div id="toast" class="toast"></div>
    <script src="app.js"></script>
  </body>
</html>
